@if (isLoading) {
    @if (wishlist.count!=0) {
        <div class="container my-5 bg-main-light p-4 rounded-4">
        <h1>My Wish List :</h1>
        @for (product of wishlist.data; track $index) {
            <div class="row border-bottom py-2">
                <div class="col-lg-2">
                  <img [src]='product.imageCover' alt="" class="w-100">
                </div>
                <div class="col-lg-10 d-flex justify-content-between">
                   <div>
                      <h4>{{product.title}}</h4>
                      <p class="text-main">{{product.price}} EGP</p>
                      <button class="btn bg-danger text-white" (click)="removeProductFromWishlist(product._id)">Remove</button>
                   </div>
                  <div class="my-4">            
                      <button class="btn bg-main text-white my-5 "(click)="addProduct(product._id)">ADD TO CART</button>          
                </div>
                </div>
                

          </div>

        }
        
    </div>
}
 @else {
    <h2 class="text-main h2 my-5 text-center fs-1">List is empty</h2>
 }   
}
@else {
    <h2 class="text-main h2 my-5 text-center fs-1">loading....</h2>
}
