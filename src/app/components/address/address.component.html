<div class="container my-5">
    <h2 class="my-4">Address : </h2>
    <form [formGroup]="address" (ngSubmit)="payment()">
        <textarea formControlName="details" class="form-control my-3 " placeholder="type your details..."></textarea>
        <input formControlName="phone" class="form-control my-3 " type="tel" placeholder="type your phone...">
        <input formControlName="city" class="form-control my-3 " type="text" placeholder="type your city...">
        <button class="bg-main btn text-white my-2 w-100">pay</button>
    </form>
</div>
