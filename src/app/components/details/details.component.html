<section>
    <div class="container">
        <div class="row">
            <div class="col-lg-3">
                <div class="item">
                    <img [src]="allDetails?.imageCover" class="w-100" alt="product">
                </div>
            </div>
            <div class="col-lg-9 mt-5 pt-5">
                <div class="item">
                    <h1>{{allDetails?.title}}</h1>
                    <p>{{allDetails?.description}}</p>
                    <span>{{allDetails?.category?.name}}</span>
                    <div class="d-flex justify-content-between my-3">
<span>{{allDetails?.price}}EGP</span>
<span><i class="fa-solid fa-star" style="color: #FFD43B;"></i>{{allDetails?.ratingsAverage}}</span>
                    </div>
                    <button class="btn bg-main text-white w-100 my-2 "(click)="addProduct(allDetails._id)">Add To Cart</button>
                </div>
            </div>
        </div>
    </div>
</section>
