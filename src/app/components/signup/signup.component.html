<div class="w-75 m-auto my-5">
    <h1>Register Now:</h1>
    <form [formGroup]="register"(ngSubmit)="sendData()">
        <input [ngClass]="{
            'is-valid':!register.get('name')?.errors&&register.get('name')?.dirty,
            'is-invalid':register.get('name')?.errors&&register.get('name')?.dirty,
        }" formControlName="name" type="text" class="form-control my-3 "  placeholder="Type your name.."/>
        <app-alert-error [formName]="register"controlName="name"/>
        <input  [ngClass]="{
            'is-valid':!register.get('email')?.errors&&register.get('email')?.dirty,
            'is-invalid':register.get('email')?.errors&&register.get('email')?.dirty,
        }" formControlName="email" type="email" class="form-control my-3"  placeholder="Type your email.."/>
        <app-alert-error [formName]="register"controlName="email"/>
        <input   [ngClass]="{
            'is-valid':!register.get('password')?.errors&&register.get('password')?.dirty,
            'is-invalid':register.get('password')?.errors&&register.get('password')?.dirty,
        }"formControlName="password" type="password" class="form-control  my-3"  placeholder="Type your password.."/>
        <app-alert-error [formName]="register"controlName="password"/>
        <input  [ngClass]="{
            'is-valid':!register.getError('mismatch')&&register.get('rePassword')?.dirty,
            'is-invalid':register.getError('mismatch')&&register.get('rePassword')?.dirty,
        }" formControlName="rePassword" type="password" class="form-control my-3"  placeholder="Type your repassword.."/>
        <app-alert-error [formName]="register"controlName="rePassword"/>
        
        <p class="h3 text-danger">{{erorr}}</p>
        <button class="btn text-white bg-main w-100"[disabled]="register.invalid||isBtnSubmit">
            @if(isBtnSubmit==false){Register} 
            @else  { <i class="fa-solid fa-spinner fa-spin"></i>}
        </button>

    </form>
</div>
