<div class="container mt-5 ">
    <div class="row">
        @for (product of allProducts; track $index) {
        <div class="col-lg-2">
            <div class="product p-2">
                    <img [src]="product.imageCover" class="w-100" alt=""> 
                    <h5 class="text-main">{{product.category.name}}</h5>
                    <h4 class="fw-bold">{{product.title.slice(0,15)+'...'}}</h4>
                    <div class="d-flex justify-content-between">
                        <span>{{product.price}}EGP</span>
                        <span><i class="fa-solid fa-star" style="color: #FFD43B;"></i>{{product.ratingsAverage}}</span>
                    </div>
                    <button class="btn bg-main text-white w-100 my-2">ADD TO CART</button>
                </div>
               </div>
                }
            </div>
        </div>
