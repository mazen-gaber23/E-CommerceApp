<div class="container mt-5 ">
    <input [(ngModel)]="term" type="text" class="w-75 m-auto my-5 form-control" placeholder="search...">
    <div class="row">
        @for (product of allProducts|search:term; track $index) {
            <div class="col-lg-2">
                <div class="product p-2">
                    <div [routerLink]="'/details/'+ product.id">
                         <img [src]="product.imageCover" class="w-100" alt=""> 
                        <h5 class="text-main">{{product.category.name}}</h5>
                        <h4 class="fw-bold">{{product.title.slice(0,15)+'...'}}</h4>
                        <div class="d-flex justify-content-between">
                            <span>{{product.price|currency:'EGP'}}</span>
                            <span><i class="fa-solid fa-star" style="color: #FFD43B;"></i>{{product.ratingsAverage}}</span>
                        </div>
                        <p class="text-danger">{{product.quantity|soldOut}}</p>
                    </div>
                    <span (click)="addWishlist(product.id)" ><i class="fa-solid fa-heart fs-3 "  [class.text-danger]="wishlistStatus[product.id]"></i></span>
    
                        <button class="btn bg-main text-white w-100 my-2"(click)="addProduct(product._id)">ADD TO CART</button>
                    </div>
                   </div>
                    }
            </div>
        </div>
